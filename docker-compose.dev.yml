version: '3.8'

services:
  wallet-db:
    image: 'postgres:latest'
    container_name: wallet-postgres-dev
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
      #- 'POSTGRES_HOST_AUTH_METHOD: trust'
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    # Альтернативный рабочий healthcheck
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev_user -d wallet_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_dev_data: