# src/main/resources/application-dev.yml

# Этот файл активируется ТОЛЬКО при активном профиле 'dev'
spring:
  config:
    activate:
      on-profile: dev

  # ДАННЫЕ ДЛЯ ПОДКЛЮЧЕНИЯ К БАЗЕ В DEV-СРЕДЕ (например, локальный PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_dev
    username: dev_user
    password: dev_password
    hikari:
      maximum-pool-size: 10 # Небольшой пул для разработки
      connection-timeout: 30000

  # Расширенное логирование SQL-запросов для отладки
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true # Красивое форматирование SQL в логах
        use_sql_comments: true

  # Настройки для встроенной H2 БД (опционально, для быстрых unit-тестов без PostgreSQL)
  h2:
    console:
      enabled: true
      path: /h2-console

# Детальное логирование для отладки бизнес-логики
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.demo.walletservice: TRACE # Максимальная детализация для вашего кода
  file:
    name: ./logs/wallet-service-dev.log

  # Отключаем кэширование шаблонов, чтобы видеть изменения без перезагрузки
  thymeleaf:
    cache: false